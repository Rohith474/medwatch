version: '3.9'

services:
  db:
    image: postgres:16
    container_name: medwatch_db
    restart: always
    environment:
      POSTGRES_DB: medwatch
      POSTGRES_USER: medwatch_user
      POSTGRES_PASSWORD: medwatch_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: medwatch_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: medwatch_backend
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  celery:
    build: ./backend
    container_name: medwatch_celery
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
